<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OWL Work Orders</title>
<style>
:root {
  --bg: #f6f7f9; --card: #fff; --ink: #15181d; --muted: #646b75; --line: #e2e5ea;
  --accent: #2d5bd7; --safe: #1f8a4c; --caution: #b7791f; --danger: #c53030;
  --danger-bg: #fdecec; --safe-bg: #e8f6ee;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #111317; --card: #1a1d23; --ink: #e9ecf1; --muted: #9aa3ae; --line: #2a2f37;
    --accent: #7b9cff; --safe: #4cc985; --caution: #e5b45a; --danger: #ff7a7a;
    --danger-bg: #3a1d1f; --safe-bg: #17301f; }
}
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; background: var(--bg); color: var(--ink); }
header { padding: 20px 24px 8px; }
header h1 { margin: 0; font-size: 20px; }
header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--line); padding: 1px 5px; border-radius: 4px; }
main { display: grid; grid-template-columns: 320px 1fr; gap: 16px; padding: 16px 24px 32px; }
@media (max-width: 820px) { main { grid-template-columns: 1fr; padding: 12px 16px; } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 12px; }
label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
input { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
button { margin-top: 14px; padding: 9px 14px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
button.secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.orders { margin-top: 16px; }
.order { padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
.order.sel { border-color: var(--accent); }
.order .t { font-weight: 600; }
.order .m { color: var(--muted); font-size: 13px; }
.chip { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; margin-left: 6px; vertical-align: 1px; }
.chip.open, .chip.assigned { background: var(--line); color: var(--accent); }
.chip.accepted { background: var(--safe-bg); color: var(--safe); }
.chip.closed, .chip.expired { background: var(--line); color: var(--muted); }
.chip.bad { background: var(--danger-bg); color: var(--danger); }
.check { padding: 14px 16px; border-radius: 8px; margin: 4px 0 16px; font-size: 16px; }
.check.bad { background: var(--danger-bg); border-left: 4px solid var(--danger); }
.check.good { background: var(--safe-bg); border-left: 4px solid var(--safe); }
.target { font-size: 28px; font-weight: 700; margin: 0 0 4px; }
.target s { color: var(--danger); font-weight: 500; font-size: 20px; margin-left: 10px; }
.facts { display: flex; flex-wrap: wrap; gap: 18px; color: var(--muted); font-size: 13px; margin-bottom: 16px; }
.facts b { color: var(--ink); }
ol.events { list-style: none; padding: 0; margin: 0; border-left: 2px solid var(--line); }
ol.events li { position: relative; padding: 0 0 14px 16px; }
ol.events li::before { content: ""; position: absolute; left: -6px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
ol.events li.warning::before, ol.events li.wrong-pull::before { background: var(--danger); }
ol.events li.pull::before, ol.events li.guidance::before { background: var(--safe); }
.ev-h { font-size: 12px; color: var(--muted); }
.ev-t { margin-top: 2px; }
.ev-q { color: var(--muted); font-style: italic; }
.empty { color: var(--muted); }
.err { color: var(--danger); font-size: 13px; margin-top: 8px; }
a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>OWL Work Orders</h1>
  <p>A sample ticketing app built on OWL's API: <code>POST /api/workorders</code>, <code>GET /api/workorders/{id}</code>, <code>POST /api/workorders/{id}/close</code></p>
</header>
<main>
  <section>
    <form class="card" id="new">
      <h2>New work order</h2>
      <label for="ticket">Ticket</label>
      <input id="ticket" value="WO-1042">
      <label for="device">Device to take offline</label>
      <input id="device" value="wanheda" placeholder="hostname, IP or MAC">
      <div class="row">
        <div><label for="port">Port on the ticket</label><input id="port" type="number" min="1" value="7"></div>
        <div><label for="minutes">Window (min)</label><input id="minutes" type="number" min="5" value="60"></div>
      </div>
      <label for="tech">Assign to</label>
      <input id="tech" placeholder="Leave empty to let any tech accept it">
      <label for="note">Note</label>
      <input id="note" value="Take wanheda offline for a disk swap">
      <button type="submit">File work order</button>
      <div class="err" id="formErr"></div>
    </form>
    <div class="orders" id="orders"></div>
  </section>
  <section class="card" id="detail"><p class="empty">File a work order or pick one to see what OWL found.</p></section>
</main>
<script>
let selected = null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const time = (t) => new Date(t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });

async function api(method, path, body) {
  const res = await fetch(path, { method, headers: { "Content-Type": "application/json" }, body: body && JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

$("new").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("formErr").textContent = "";
  try {
    const order = await api("POST", "/api/workorders", {
      ticket: $("ticket").value, device: $("device").value, claimed_port: Number($("port").value) || 0,
      tech: $("tech").value, note: $("note").value, minutes: Number($("minutes").value) || 60,
    });
    selected = order.id;
    refresh();
  } catch (err) { $("formErr").textContent = err.message; }
});

const statusText = { open: "waiting for a tech", assigned: "assigned", accepted: "in progress", closed: "closed", expired: "expired" };
const labels = { warning: "OWL warned", guidance: "OWL guided", pull: "Switch confirmed the pull", "wrong-pull": "Wrong port pulled", replug: "Plugged back in", drift: "Cable moved" };

function renderDetail(o) {
  const bad = o.mismatch;
  const device = o.device ? (o.device_online_now ? `${esc(o.device)} is still online on port ${o.device_port_now}` : `${esc(o.device)} is offline`) : "";
  const events = o.events.length ? `<ol class="events">${o.events.map((e) => `
      <li class="${esc(e.type)}"><div class="ev-h">${time(e.ts)} · ${labels[e.type] || esc(e.type)} · port ${e.port}${e.evidence ? ` · <a href="/api/evidence/${esc(e.evidence)}" target="_blank">clip</a>` : ""}</div>
      ${e.heard ? `<div class="ev-q">“${esc(e.heard)}”</div>` : ""}<div class="ev-t">${esc(e.text || e.diff || "")}</div></li>`).join("")}</ol>`
    : `<p class="empty">Nothing yet. OWL adds what it tells the tech and what the switch confirms here as the work happens.</p>`;
  $("detail").innerHTML = `
    <h2>${esc(o.ticket || "Work order " + o.id)} <span class="chip ${o.status}">${statusText[o.status] || o.status}</span></h2>
    <p class="target">Port ${o.port}${bad ? `<s>ticket said ${o.claimed_port}</s>` : ""}</p>
    <div class="check ${bad ? "bad" : "good"}">${esc(o.check)}</div>
    <div class="facts"><span>Tech <b>${esc(o.tech || "waiting for a tech to accept")}</b>${o.accepted ? ` · accepted ${time(o.accepted)}` : ""}</span><span>Until <b>${time(o.end)}</b></span>${device ? `<span>Now <b>${device}</b></span>` : ""}</div>
    ${o.note ? `<p>${esc(o.note)}</p>` : ""}
    <h2>Evidence</h2>${events}
    ${["open", "assigned", "accepted"].includes(o.status) ? `<button class="secondary" id="close">Close work order</button>` : ""}`;
  const close = $("close");
  if (close) close.onclick = async () => { await api("POST", `/api/workorders/${o.id}/close`); refresh(); };
}

async function refresh() {
  try {
    const { work_orders } = await api("GET", "/api/workorders");
    $("orders").innerHTML = work_orders.map((o) => `
      <div class="order ${o.id === selected ? "sel" : ""}" data-id="${o.id}">
        <div class="t">${esc(o.ticket || "#" + o.id)} <span class="chip ${o.status}">${statusText[o.status] || o.status}</span>${o.mismatch ? `<span class="chip bad">ticket port wrong</span>` : ""}</div>
        <div class="m">${esc(o.device || "port " + o.claimed_port)} · port ${o.port} · ${esc(o.tech || "unassigned")}</div>
      </div>`).join("");
    document.querySelectorAll(".order").forEach((el) => el.onclick = () => { selected = Number(el.dataset.id); refresh(); });
    if (selected) renderDetail(await api("GET", `/api/workorders/${selected}`));
  } catch (err) { $("formErr").textContent = err.message; }
}
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
